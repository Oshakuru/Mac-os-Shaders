# Metal 1.0
oldLighting=false
separateAo=false
shadowTranslucent=false
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false
screen=<empty> <empty> <profile> VISUAL_STYLE <empty> <empty> [PERFORMANCE_SETTINGS] [STYLE_SETTINGS] [LIGHTING_SETTINGS] [ATMOSPHERE_SETTINGS] [OTHER_SETTINGS]
screen.columns=2
screen.PERFORMANCE_SETTINGS=<profile> <empty> [PERF_SHADOWS] [PERF_CLOUDS] [PERF_WATER] [PERF_EFFECTS] [PERF_FOLIAGE] [APPLE_SETTINGS] [PERF_ANTIALIASING] <empty>
screen.PERFORMANCE_SETTINGS.columns=2
screen.STYLE_SETTINGS=[COLOR_GRADING] <empty> VISUAL_STYLE <empty> DARK_STYLE_STRENGTH CARTOON_STRENGTH DARK_LIGHT_TINT
screen.STYLE_SETTINGS.columns=2
screen.LIGHTING_SETTINGS=MAX_LIGHTING <empty> [SHADOW_SETTINGS] [AMBIENT_SETTINGS] [BLOCKLIGHT_SETTINGS] [AO_SETTINGS]
screen.LIGHTING_SETTINGS.columns=2
screen.SHADOW_SETTINGS=PLAYER_SHADOW ENTITY_SHADOWS BLOCK_ENTITY_SHADOWS SHADOWS SHADOW_STRENGTH SHADOW_FILTER shadowMapResolution shadowDistance RECEIVER_CORRECTION SHADOW_BIAS
screen.SHADOW_SETTINGS.columns=2
screen.AMBIENT_SETTINGS=AMBIENT_LIGHT NIGHT_AMBIENT MOON_CONTRAST
screen.BLOCKLIGHT_SETTINGS=TORCH_FALLOFF
screen.AO_SETTINGS=MAX_AO MAX_AO_QUALITY MAX_AO_STRENGTH
screen.ATMOSPHERE_SETTINGS=[CLOUD_SETTINGS] [WEATHER_SETTINGS] [CELESTIAL_SETTINGS] [FOG_SETTINGS] [SUNBEAM_SETTINGS] [WATER_SETTINGS] [WET_GROUND_SETTINGS]
screen.FOG_SETTINGS=DARK_HAZE
screen.SUNBEAM_SETTINGS=MAX_SUNBEAMS SUNBEAM_STEPS MAX_SUNBEAM_STRENGTH
screen.OTHER_SETTINGS=[APPLE_SETTINGS] [DIAGNOSTICS]
screen.DIAGNOSTICS=DEBUG_VIEW
sliders=WATER_ABSORPTION RAIN_RIPPLE_STRENGTH WATER_WAVE_STRENGTH CLOUD_OPACITY shadowDistance SHADOW_STRENGTH AMBIENT_LIGHT NIGHT_AMBIENT MOON_CONTRAST SHADOW_BIAS DARK_STYLE_STRENGTH DARK_HAZE DARK_LIGHT_TINT CARTOON_STRENGTH MAX_AO_STRENGTH MAX_SUNBEAM_STRENGTH

screen.APPLE_SETTINGS=APPLE_SUN_SETUP APPLE_DEPTH_RECONSTRUCTION
screen.APPLE_SETTINGS.columns=1

screen.CLOUD_SETTINGS=CLOUD_STYLE CLOUD_OPACITY SDV_CLOUD_LAYERS SDV_CLOUD_STEPS
screen.CLOUD_SETTINGS.columns=1
#if CLOUD_STYLE == 1
clouds=off
#elif CLOUD_STYLE == 2
clouds=fancy
#endif

#if CLOUD_STYLE == 2
alphaTest.gbuffers_clouds=GREATER 0.001
#endif

screen.CELESTIAL_SETTINGS=CUBIC_CELESTIALS
screen.CELESTIAL_SETTINGS.columns=1
#if CUBIC_CELESTIALS == 1
sun=false
moon=false
customTexture.cubicSunTexture=textures/cubic/sun.png
customTexture.cubicMoonTexture=textures/cubic/moon_phases.png
#endif

screen.WATER_SETTINGS=MAKEUP_WATER WATER_WAVE_STRENGTH WATER_REFLECTIONS WATER_REFRACTION WATER_ABSORPTION WATER_SSR_STEPS RAIN_RIPPLES RAIN_RIPPLE_STRENGTH
screen.WATER_SETTINGS.columns=1

screen.WET_GROUND_SETTINGS=RAIN_PUDDLES WET_GROUND_REFLECTIONS WET_REFLECTION_RESOLUTION
screen.WET_GROUND_SETTINGS.columns=1
#if RAIN_PUDDLES == 1
customTexture.puddleNoise=textures/photon/puddle_noise.png
#endif
#if RAIN_PUDDLES == 0 || WET_GROUND_REFLECTIONS == 0 || DEBUG_VIEW != 0
program.deferred.enabled=false
#endif
#if MAKEUP_WATER == 0 && (RAIN_PUDDLES == 0 || WET_GROUND_REFLECTIONS == 0 || DEBUG_VIEW != 0)
program.deferred1.enabled=false
#endif
program.world-1/deferred.enabled=false
program.world1/deferred.enabled=false
#if MAKEUP_WATER == 0
program.world-1/deferred1.enabled=false
program.world1/deferred1.enabled=false
#endif
#if WET_REFLECTION_RESOLUTION == 0
size.buffer.colortex5=0.5 0.5
#else
size.buffer.colortex5=1.0 1.0
#endif

# MakeUp water can legitimately output alpha below the standard cutout threshold.
#if MAKEUP_WATER == 1
alphaTest.gbuffers_water=GREATER 0.001
alphaTest.world-1/gbuffers_water=GREATER 0.001
alphaTest.world1/gbuffers_water=GREATER 0.001
#endif

screen.WEATHER_SETTINGS=UNOBTRUSIVE_WEATHER
#if UNOBTRUSIVE_WEATHER == 1
customTexture.metalRainTexture=textures/weather/rain.png
customTexture.metalSnowTexture=textures/weather/snow.png
#endif

#if MAKEUP_WATER == 1
customTexture.makeupWaveTexture=textures/makeup/water_256_RG_8bit.png
#endif

#if CLOUD_STYLE == 1
customTexture.sdvCloudMap=textures/sdv/clouds.png
#endif

#if SHADOWS == 0
program.shadow.enabled=false
#endif

screen.PERF_SHADOWS=PLAYER_SHADOW ENTITY_SHADOWS BLOCK_ENTITY_SHADOWS SHADOWS shadowMapResolution shadowDistance SHADOW_FILTER RECEIVER_CORRECTION SHADOW_BIAS SHADOW_STRENGTH
screen.PERF_CLOUDS=CLOUD_STYLE SDV_CLOUD_LAYERS SDV_CLOUD_STEPS CLOUD_OPACITY
screen.PERF_WATER=MAKEUP_WATER WATER_REFLECTIONS WATER_SSR_STEPS WATER_REFRACTION WATER_WAVE_STRENGTH WATER_ABSORPTION RAIN_PUDDLES WET_GROUND_REFLECTIONS WET_REFLECTION_RESOLUTION RAIN_RIPPLES RAIN_RIPPLE_STRENGTH
screen.PERF_EFFECTS=MAX_LIGHTING MAX_AO MAX_AO_QUALITY MAX_AO_STRENGTH MAX_SUNBEAMS SUNBEAM_STEPS MAX_SUNBEAM_STRENGTH CUBIC_CELESTIALS UNOBTRUSIVE_WEATHER
screen.PERF_FOLIAGE=FOLIAGE_WIND FOLIAGE_WIND_STRENGTH

screen.PERF_ANTIALIASING=FXAA
screen.COLOR_GRADING=GRADE_BRIGHTNESS GRADE_CONTRAST GRADE_SATURATION GRADE_GREEN_SATURATION
#if ENTITY_SHADOWS == 0
shadowEntities=false
#endif
#if BLOCK_ENTITY_SHADOWS == 0
shadowBlockEntities=false
#endif

profile.FAST=\
    shadowMapResolution=512 shadowDistance=48.0 SHADOWS=1 SHADOW_STRENGTH=0.85 SHADOW_FILTER=0 \
    AMBIENT_LIGHT=0.58 TORCH_FALLOFF=2 SHADOW_BIAS=1.0 DEBUG_VIEW=0 RECEIVER_CORRECTION=1 \
    NIGHT_AMBIENT=0.58 MOON_CONTRAST=0.45 DARK_STYLE_STRENGTH=1.0 DARK_HAZE=0.30 DARK_LIGHT_TINT=0.50 \
    CARTOON_STRENGTH=1.0 MAX_AO=0 MAX_SUNBEAMS=0 MAX_AO_QUALITY=1 SUNBEAM_STEPS=4 \
    MAX_AO_STRENGTH=0.22 MAX_SUNBEAM_STRENGTH=0.15 MAX_LIGHTING=0 APPLE_SUN_SETUP=1 APPLE_DEPTH_RECONSTRUCTION=1 \
    CLOUD_STYLE=1 SDV_CLOUD_STEPS=8 SDV_CLOUD_LAYERS=1 CLOUD_OPACITY=1.0 CUBIC_CELESTIALS=1 \
    MAKEUP_WATER=1 WATER_REFRACTION=1 WATER_ABSORPTION=0.10 WATER_WAVE_STRENGTH=1.0 WATER_SSR_STEPS=6 \
    WATER_REFLECTIONS=0 RAIN_PUDDLES=1 WET_GROUND_REFLECTIONS=0 UNOBTRUSIVE_WEATHER=1 RAIN_RIPPLES=1 \
    RAIN_RIPPLE_STRENGTH=0.6 FOLIAGE_WIND=1 FOLIAGE_WIND_STRENGTH=0.5 ENTITY_SHADOWS=0 BLOCK_ENTITY_SHADOWS=0 \
    FXAA=0 GRADE_BRIGHTNESS=1.0 GRADE_CONTRAST=1.0 GRADE_SATURATION=1.0 GRADE_GREEN_SATURATION=1.0 \
    WET_REFLECTION_RESOLUTION=0 PLAYER_SHADOW=1

profile.BALANCED=\
    shadowMapResolution=512 shadowDistance=48.0 SHADOWS=1 SHADOW_STRENGTH=0.85 SHADOW_FILTER=1 \
    AMBIENT_LIGHT=0.58 TORCH_FALLOFF=2 SHADOW_BIAS=1.0 DEBUG_VIEW=0 RECEIVER_CORRECTION=1 \
    NIGHT_AMBIENT=0.58 MOON_CONTRAST=0.45 DARK_STYLE_STRENGTH=1.0 DARK_HAZE=0.30 DARK_LIGHT_TINT=0.50 \
    CARTOON_STRENGTH=1.0 MAX_AO=0 MAX_SUNBEAMS=1 MAX_AO_QUALITY=1 SUNBEAM_STEPS=4 \
    MAX_AO_STRENGTH=0.22 MAX_SUNBEAM_STRENGTH=0.15 MAX_LIGHTING=1 APPLE_SUN_SETUP=1 APPLE_DEPTH_RECONSTRUCTION=1 \
    CLOUD_STYLE=1 SDV_CLOUD_STEPS=8 SDV_CLOUD_LAYERS=2 CLOUD_OPACITY=1.0 CUBIC_CELESTIALS=1 \
    MAKEUP_WATER=1 WATER_REFRACTION=0 WATER_ABSORPTION=0.10 WATER_WAVE_STRENGTH=1.0 WATER_SSR_STEPS=6 \
    WATER_REFLECTIONS=1 RAIN_PUDDLES=1 WET_GROUND_REFLECTIONS=1 UNOBTRUSIVE_WEATHER=1 RAIN_RIPPLES=1 \
    RAIN_RIPPLE_STRENGTH=0.6 FOLIAGE_WIND=1 FOLIAGE_WIND_STRENGTH=0.5 ENTITY_SHADOWS=0 BLOCK_ENTITY_SHADOWS=0 \
    FXAA=0 GRADE_BRIGHTNESS=0.8 GRADE_CONTRAST=1.0 GRADE_SATURATION=1.2 GRADE_GREEN_SATURATION=1.0 \
    WET_REFLECTION_RESOLUTION=0 PLAYER_SHADOW=1

profile.CRISP=\
    shadowMapResolution=2048 shadowDistance=80.0 SHADOWS=1 SHADOW_STRENGTH=0.85 SHADOW_FILTER=2 \
    AMBIENT_LIGHT=0.58 TORCH_FALLOFF=2 SHADOW_BIAS=1.0 DEBUG_VIEW=0 RECEIVER_CORRECTION=1 \
    NIGHT_AMBIENT=0.58 MOON_CONTRAST=0.45 DARK_STYLE_STRENGTH=1.0 DARK_HAZE=0.30 DARK_LIGHT_TINT=0.50 \
    CARTOON_STRENGTH=1.0 MAX_AO=1 MAX_SUNBEAMS=1 MAX_AO_QUALITY=2 SUNBEAM_STEPS=8 \
    MAX_AO_STRENGTH=0.22 MAX_SUNBEAM_STRENGTH=0.15 MAX_LIGHTING=1 APPLE_SUN_SETUP=1 APPLE_DEPTH_RECONSTRUCTION=1 \
    CLOUD_STYLE=1 SDV_CLOUD_STEPS=32 SDV_CLOUD_LAYERS=2 CLOUD_OPACITY=1.0 CUBIC_CELESTIALS=1 \
    MAKEUP_WATER=1 WATER_REFRACTION=1 WATER_ABSORPTION=0.10 WATER_WAVE_STRENGTH=1.0 WATER_SSR_STEPS=16 \
    WATER_REFLECTIONS=2 RAIN_PUDDLES=1 WET_GROUND_REFLECTIONS=2 UNOBTRUSIVE_WEATHER=1 RAIN_RIPPLES=1 \
    RAIN_RIPPLE_STRENGTH=0.6 FOLIAGE_WIND=1 FOLIAGE_WIND_STRENGTH=0.5 ENTITY_SHADOWS=1 BLOCK_ENTITY_SHADOWS=1 \
    FXAA=0 GRADE_BRIGHTNESS=1.0 GRADE_CONTRAST=1.0 GRADE_SATURATION=1.0 GRADE_GREEN_SATURATION=1.0 \
    WET_REFLECTION_RESOLUTION=1 PLAYER_SHADOW=1

#if PLAYER_SHADOW == 1
shadowPlayer=true
#else
shadowPlayer=false
#endif
#if BLOCK_ENTITY_SHADOWS == 0
shadowLightBlockEntities=false
#endif
