name: Python tooling coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Report the actual PR head, rather than GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install coverage
        run: python -m pip install coverage==7.10.7

      - name: Validate source and profiles and build public package
        run: |
          python -m coverage erase
          python -m coverage run tools/validate.py
          python -m coverage run --append tools/check_profiles.py
          python -m coverage run --append tools/build.py --without-cubic
          python -m coverage xml -o cobertura.xml
          python -m coverage report

      - name: Save coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-tooling-coverage
          path: cobertura.xml
          if-no-files-found: error

      # Forks and Dependabot do not receive the repository secret.
      # PRs still run all checks and retain the XML report without it.
      - name: Check Codacy token availability
        id: codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Codacy upload skipped. Add the CODACY_PROJECT_TOKEN repository Actions secret to enable uploads."
          fi

      - name: Upload Python tooling coverage to Codacy
        if: steps.codacy.outputs.enabled == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        # The reporter reads this variable directly. Avoid the action's token
        # input, which interpolates credentials into shell source.
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        with:
          coverage-reports: cobertura.xml
          language: Python
